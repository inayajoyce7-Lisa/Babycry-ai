steps:
  - name: Télécharger le code
    uses: actions/checkout@v4

  - name: Installer Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Installer les dépendances
    run: npm install

  - name: Compiler l'application
    run: npm run build

  - name: Vérifier les fichiers compilés
    run: |
      ls -la
      ls -la dist

  - name: Enregistrer le résultat
    uses: actions/upload-artifact@v4
    with:
      name: BabyCry-AI-build
      path: dist/
      if-no-files-found: error
